# =========================================================
# Task Scripts Config Template (Sanitized)
# =========================================================
#
# 使用方式：
# 1) 複製此檔為 config.yaml
# 2) 依實際環境填入路徑、容器名、port、保留天數等
# 3) 不要把真實敏感值提交到版本庫
#
# =========================================================

teams:
  api_conf: /path/to/teamapi.conf
  default_title: 系統通知
  default_target: General
  test_mode: true

pod_status:
  log_file: /var/log/podman_monitor.log
  default_title: 容器異常警告
  teams_api_script: /absolute/path/to/tasks/teams_api.sh

borg:
  repo: /path/to/borg/repo

  keep_daily: 14
  keep_weekly: 0
  keep_monthly: 12

  backup_targets:
    - name: app_data
      path: /path/to/app/data

    - name: etc
      path: /etc

    - name: logs
      path: /var/log

  exclude_paths:
    - /var/log/journal
    - /var/log/*.gz

  manual_exclude_paths:
    - /path/to/backup/output
    - /var/log/journal

mariadb_sql:
  backup_dir: /path/to/sql/backups
  retention_days: 7

  containers:
    - mariadb-container-name

mydumper:
  image: docker.io/mydumper/mydumper:v0.21.3-1
  backup_base: /path/to/mydumper/backups
  retention_days: 7

  databases:
    - name: db-instance-name
      port: 3306
      env_file: /path/to/project/.env

save_to_log:
  log_dir: /path/to/log/output
  check_days: 3
  keep_days_audit: 30
  keep_days_etc: 30
  keep_days_journal: 7

  journal_service_prefixes:
    - app
